
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 PUNKS - UNIVERSAL MATCH ENGINE</title>
    <style>
        /* --- CSS ডিজাইন (প্রফেশনাল পার্পল ও ব্ল্যাক থিম) --- */
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0026 100%);
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .window {
            background: #141414;
            border: 1px solid #4a148c;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            overflow: hidden;
        }

        .title-bar {
            background: #2e003e;
            color: #fff;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            border-bottom: 1px solid #4a148c;
        }

        .tabs {
            display: flex;
            background: #0d0d0d;
            padding: 5px 5px 0 5px;
            border-bottom: 1px solid #222;
        }

        .tab-btn {
            background: #1a1a1a;
            color: #aaa;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            margin-right: 2px;
            border-radius: 4px 4px 0 0;
        }

        .tab-btn.active {
            background: #4a148c;
            color: #fff;
        }

        .window-body {
            padding: 20px;
        }

        fieldset {
            border: 1px solid #4a148c;
            padding: 15px;
            margin-bottom: 20px;
            color: #fff;
            border-radius: 6px;
            background: #111;
        }

        legend {
            color: #b39ddb;
            font-weight: bold;
            padding: 0 10px;
        }

        .input-row {
            margin-bottom: 12px;
        }

        .input-row.split {
            display: flex;
            gap: 10px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid #4a148c;
            color: #fff;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .radio-group {
            margin: 15px 0;
            display: flex;
            gap: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: #4a148c;
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        .action-btn:hover {
            background: #6a1b9a;
        }

        .layers-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .accordion-item {
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }

        .accordion-item:hover {
            border-color: #4a148c;
        }

        .panel {
            padding: 15px;
            background-color: #080808;
            display: none;
            border: 1px solid #4a148c;
            border-top: none;
            margin-bottom: 8px;
            border-radius: 0 0 4px 4px;
        }

        .accordion-item.active + .panel {
            display: block;
        }

        /* --- ছবি দেখানোর জন্য গ্রিড ডিজাইন --- */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }

        .image-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            position: relative;
        }

        .image-card img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 4px;
            background: #222;
        }

        .image-card .item-title {
            font-size: 12px;
            margin-top: 6px;
            color: #b39ddb;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .delete-btn {
            background: #ff1744;
            color: white;
            border: none;
            padding: 2px 6px;
            font-size: 10px;
            cursor: pointer;
            border-radius: 3px;
            margin-top: 5px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="window">
        <div class="title-bar">
            <div class="title-bar-text">💻 404 PUNKS - UNIVERSAL MATCH ENGINE</div>
        </div>

        <div class="tabs">
            <button class="tab-btn active">🔸 LAYERS</button>
            <button class="tab-btn">🔸 CREATE NFT</button>
            <button class="tab-btn">🔸 COLLECTION</button>
        </div>

        <div class="window-body">
            
            <fieldset>
                <legend>ADD NEW LAYER</legend>
                <div class="input-row">
                    <input type="text" placeholder="[ PASTE IMAGE URL HERE ]" id="imageUrl">
                </div>
                <div class="input-row split">
                    <input type="text" placeholder="[ VALUE / NAME ]" id="layerValue">
                    <select id="layerType">
                        <option value="background">Background</option>
                        <option value="base">Base</option>
                        <option value="nose">Nose</option>
                        <option value="face">Face</option>
                        <option value="neck">Neck</option>
                        <option value="mouth">Mouth</option>
                        <option value="eyes">Eyes</option>
                        <option value="ear">Ear</option>
                        <option value="beard">Beard</option>
                    </select>
                </div>
                
                <div class="radio-group">
                    <label><input type="radio" name="gender" checked> 🔸 MALE</label>
                    <label><input type="radio" name="gender"> 🔸 FEMALE</label>
                </div>

                <button class="action-btn">🔸 ADD TO LIBRARY</button>
            </fieldset>

            <div class="layers-list">
                
                <div class="accordion-item"><span>[Background]</span><span class="count" id="count-background">3 layers ▼</span></div>
                <div class="panel"><div class="grid-container" id="panel-background"></div></div>

                <div class="accordion-item"><span>[Base]</span><span class="count" id="count-base">1 layers ▼</span></div>
                <div class="panel"><div class="grid-container" id="panel-base"></div></div>

                <div class="accordion-item"><span>[Nose]</span><span class="count" id="count-nose">0 layers ▼</span></div>
                <div class="panel"><div class="grid-container" id="panel-nose"></div></div>

                <div class="accordion-item"><span>[Face]</span><span class="count" id="count-face">0 layers ▼</span></div>
                <div class="panel"><div class="grid-container" id="panel-face"></div></div>

                <div class="accordion-item"><span>[Neck]</span><span class="count" id="count-neck">0 layers ▼</span></div>
                <div class="panel"><div class="grid-container" id="panel-neck"></div></div>

                <div class="accordion-item"><span>[Mouth]</span><span class="count" id="count-mouth">0 layers ▼</span></div>
                <div class="panel"><div class="grid-container" id="panel-mouth"></div></div>

                <div class="accordion-item"><span>[Eyes]</span><span class="count" id="count-eyes">0 layers ▼</span></div>
                <div class="panel"><div class="grid-container" id="panel-eyes"></div></div>

                <div class="accordion-item"><span>[Ear]</span><span class="count" id="count-ear">0 layers ▼</span></div>
                <div class="panel"><div class="grid-container" id="panel-ear"></div></div>

                <div class="accordion-item"><span>[Beard]</span><span class="count" id="count-beard">0 layers ▼</span></div>
                <div class="panel"><div class="grid-container" id="panel-beard"></div></div>
            </div>

        </div>
    </div>

    <script>
        // কিছু ওয়ার্কিং স্যাম্পল পিকচার (টেস্ট করার জন্য)
        const initialLayers = [
            { type: 'background', value: 'Default BG', url: 'https://picsum.photos/id/10/200/200' },
            { type: 'background', value: 'Blue BG', url: 'https://picsum.photos/id/11/200/200' },
            { type: 'background', value: 'Forest BG', url: 'https://picsum.photos/id/28/200/200' },
            { type: 'base', value: 'Punk Body', url: 'https://picsum.photos/id/1062/200/200' }
        ];

        // ড্রপডাউন টগল ফাংশন
        document.querySelectorAll('.accordion-item').forEach(item => {
            item.addEventListener('click', () => {
                item.classList.toggle('active');
            });
        });

        // কার্ড তৈরি করার ফাংশন
        function createCard(type, value, url) {
            const container = document.getElementById(`panel-${type}`);
            const card = document.createElement('div');
            card.className = 'image-card';
            card.innerHTML = `
                <img src="${url}" alt="${value}" onerror="this.src='https://placehold.co/200?text=Invalid+Image'">
                <div class="item-title">${value}</div>
                <button class="delete-btn" onclick="deleteItem(this, '${type}')">Delete</button>
            `;
            container.appendChild(card);
            updateCount(type);
        }

        // লেয়ারের সংখ্যা আপডেট করার ফাংশন
        function updateCount(type) {
            const container = document.getElementById(`panel-${type}`);
            const countSpan = document.getElementById(`count-${type}`);
            const count = container.children.length;
            countSpan.innerText = `${count} layers ▼`;
        }

        // আইটেম ডিলিট করার ফাংশন
        function deleteItem(btn, type) {
            btn.parentElement.remove();
            updateCount(type);
        }

        // ইনিশিয়াল ডাটা লোড করা
        initialLayers.forEach(item => createCard(item.type, item.value, item.url));

        // "ADD TO LIBRARY" বাটনের আসল কাজ
        document.querySelector('.action-btn').addEventListener('click', () => {
            const url = document.getElementById('imageUrl').value.trim();
            const value = document.getElementById('layerValue').value.trim();
            const type = document.getElementById('layerType').value;

            if(!url || !value) {
                alert("দয়া করে IMAGE URL এবং VALUE দুটিই সঠিকভাবে লিখুন!");
                return;
            }

            createCard(type, value, url);

            // ইনপুট বক্স রিসেট
            document.getElementById('imageUrl').value = '';
            document.getElementById('layerValue').value = '';
            
            alert(`"${value}" সফলভাবে যুক্ত হয়েছে! নিচের সেকশনটি খুলে দেখুন।`);
        });
    </script>
</body>
</html>
